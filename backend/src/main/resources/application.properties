# Server
server.port=8080
spring.application.name=employee-management

# Database production/default configuration
# For local development, use the "local" profile instead of editing this file —
# see application-local.properties. Activate with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#   java -jar employee-management-1.0.0.jar --spring.profiles.active=local
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:DataSAS@2026#}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=ThisIsAVerySecureSecretKeyForJWTTokenGenerationMinimum256BitsLong
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Email — Gmail SMTPS (port 465, direct SSL — more reliable on Railway than STARTTLS/587)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:sonikanta837@gmail.com}
spring.mail.password=${MAIL_PASSWORD:omejietcakclbdxy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Scheduler (IST) — change hour/minute and restart to reschedule
# Missing-timesheet-entry audit (unrelated to attendance — nudges employees who
# haven't logged project hours for the previous working day)
app.scheduler.missing-ts-audit.hour=10
app.scheduler.missing-ts-audit.minute=30

# Performance review low-rating threshold (used to flag/highlight reviews on export)
app.performance.low-rating-threshold=3.0

# Job time tracking (Client/Job/PeriodEnd/JobType clock-in-clock-out module)
app.job-break-alert.threshold-minutes=60
# Daily job-summary rollup — deliberately not midnight (host can sleep at 00:00)
app.scheduler.job-summary.hour=23
app.scheduler.job-summary.minute=55
# Consolidated under-hours audit email (replaces the old daily-audit/attendance-audit jobs)
app.scheduler.under-hours-audit.hour=11
app.scheduler.under-hours-audit.minute=0

# App base URL — set APP_BASE_URL env var in production (e.g. https://educationsas.netlify.app)
app.base-url=${APP_BASE_URL:http://localhost:3000}


# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads

# Claude API — used for vision-based CV extraction (image/scanned PDFs)
app.claude.api-key=${CLAUDE_API_KEY:your-api-key-here}
app.claude.model=claude-haiku-4-5-20251001

# CORS
app.cors.allowed-origins=http://localhost:3000,https://educationsas.netlify.app

# Logging — set to DEBUG only during local development; use WARN/INFO in production
logging.level.com.emp.management=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
