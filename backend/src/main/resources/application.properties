# Scheduler (IST) — change hour/minute and restart to reschedule
app.scheduler.daily-audit.hour=10
app.scheduler.daily-audit.minute=0
# Missing-timesheet audit runs 30 min after the attendance audit to avoid concurrent DB writes
app.scheduler.missing-ts-audit.hour=10
app.scheduler.missing-ts-audit.minute=30
app.scheduler.break-audit.hour=19
app.scheduler.break-audit.minute=30

# Break time alert
app.attendance.break-alert.enabled=true
app.attendance.break-alert.threshold-minutes=75

# Daily work report scheduler (generates reports at 11 PM)
app.scheduler.daily-report.hour=23
app.scheduler.daily-report.minute=0

# Daily work report email (sends previous-day reports at 10:20 AM)
app.work-report.email.enabled=true
app.work-report.email.hour=10
app.work-report.email.minute=0

# Timesheet correction requests
app.correction.enabled=true
app.correction.correction-window-days=3
app.correction.email-notifications-enabled=true
app.correction.hr-notifications-enabled=true

# App base URL (used for password reset links — override in production)
# app.base-url=${APP_BASE_URL:http://localhost:3000}
app.base-url=${APP_BASE_URL:https://educationsas.netlify.app}


# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads

# CORS
app.cors.allowed-origins=http://localhost:3000,https://educationsas.netlify.app

# Logging — set to DEBUG only during local development; use WARN/INFO in production
logging.level.com.emp.management=${LOG_LEVEL:WARN}
logging.level.org.springframework.security=WARN
