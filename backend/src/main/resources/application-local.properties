# Local development overrides — layered on top of application.properties.
# Only put values here that differ from the default file; everything else
# (JWT secret, mail, scheduler times, etc.) is inherited unchanged.
#
# Activate this profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#   java -jar employee-management-1.0.0.jar --spring.profiles.active=local
#   or set env var SPRING_PROFILES_ACTIVE=local
#
# IntelliJ run config: Edit Configurations -> Active profiles: local

# Local MySQL root password (change if your local MySQL uses something else)
spring.datasource.password=${DB_PASSWORD:root}

# See generated SQL in the console during local dev
spring.jpa.show-sql=true

# Verbose app logging locally
logging.level.com.emp.management=DEBUG
