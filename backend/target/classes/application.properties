# Server
server.port=8080
spring.application.name=employee-management

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=ThisIsAVerySecureSecretKeyForJWTTokenGenerationMinimum256BitsLong
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Email (configure your SMTP settings)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sonikanta837@gmail.com
spring.mail.password=omejietcakclbdxy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads

# CORS
app.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.emp.management=DEBUG
logging.level.org.springframework.security=INFO
